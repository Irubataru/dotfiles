# vi: set ft=yaml.ansible :

- name: Update default vars
  ansible.builtin.set_fact:
    docker: "{{ docker | combine(data.software.docker, recursive=True) }}"
  when: data.software.docker is defined | default(false)

- name: Link compose up alias
  ansible.builtin.file:
    src: "{{ role_path }}/fish/functions/up.fish"
    dest: "{{ config_directory }}/fish/functions/up.fish"
    state: link
  when: docker.aliases

- name: Link compose down alias
  ansible.builtin.file:
    src: "{{ role_path }}/fish/functions/down.fish"
    dest: "{{ config_directory }}/fish/functions/down.fish"
    state: link
  when: docker.aliases
